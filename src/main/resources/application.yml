server:
  port: 8081
  servlet:
    context-path: /flowplan
spring:
  application:
    name: FlowPlan
  config:
    import: optional:file:./config/application-local.yml,optional:file:./application-local.yml,optional:classpath:application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${MYSQL_URL:jdbc:mysql://localhost:3306/flowplan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: "${MYSQL_USERNAME:root}"
    password: "${MYSQL_PASSWORD:}"
  jackson:
    serialization:
      indent-output: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lxy.flowplan.pojo
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}"
  jwt:
    secret: "${APP_JWT_SECRET:change-this-jwt-secret-before-deploying}"
    expiration-hours: ${APP_JWT_EXPIRATION_HOURS:24}
  ai:
    api-key: ${DEEPSEEK_API_KEY:${AI_API_KEY:}}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:20}
    audit-enabled: ${AI_AUDIT_ENABLED:false}
